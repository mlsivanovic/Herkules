apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// package.json is the single version source for the web app, the APK and the
// android-v* release tag. versionCode grows with every x.y.z bump, so a newer
// APK always installs over an older one.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def appVersionParts = appVersion.tokenize('.').collect { it.replaceAll(/\D.*$/, '') as int }
if (appVersionParts.size() != 3 || appVersionParts[1] > 99 || appVersionParts[2] > 99) {
    throw new GradleException("package.json version must be x.y.z with y and z below 100, got ${appVersion}")
}
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

android {
    namespace = "dev.mlsivanovic.herkules"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    defaultConfig {
        applicationId "dev.mlsivanovic.herkules"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Local names must differ from the DSL properties; `this` here is the project.
            def envStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def envStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def envKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
            def envKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
            if (envStorePath && envStorePassword && envKeyAlias && envKeyPassword) {
                storeFile = file(envStorePath)
                storePassword = envStorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}

apply from: 'capacitor.build.gradle'
