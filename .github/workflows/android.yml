name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check release tag matches package.json
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "android-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version (expected android-v$version)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "Set the ANDROID_KEYSTORE_BASE64 secret before building a release APK."
              exit 1
            fi
            # A manual run without the key still proves the app builds.
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building an unsigned APK that cannot be installed."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/herkules.keystore"
          echo "path=$RUNNER_TEMP/herkules.keystore" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: herkules-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "Sideload this APK on Android. It is signed with the Herkules release key, so a later build updates the installed app." \
            --latest=false
