name: Supabase keepalive

# Prevents the free-tier Supabase project from being paused after a week of
# inactivity by pinging PostgREST twice a week. GitHub disables scheduled
# workflows after 60 days without repo activity.
on:
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgREST
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY variables not set — skipping."
            exit 0
          fi
          # The anon role has no grants (deny-by-default RLS), so PostgREST
          # replies 4xx — any HTTP response still counts as project activity.
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/rest/v1/exercises?select=id&limit=1")
          if [ "$status" = "000" ]; then
            echo "keepalive ping FAILED (no response from PostgREST)"
            exit 1
          fi
          echo "keepalive ping OK (HTTP $status)"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
